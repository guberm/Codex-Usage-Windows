name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test, publish and verify Windows UI
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Usage-Windows-win-x64
          path: artifacts/release/*
      - uses: actions/upload-artifact@v4
        with:
          name: UI-smoke-evidence
          path: artifacts/smoke/*
